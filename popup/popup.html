<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkoolCal Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="3" fill="currentColor" opacity=".18"/>
          <rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3 9h18" stroke="currentColor" stroke-width="1.6"/>
          <path d="M7 3v4M17 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M8 13.5l2.2 2.2L16 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span class="brand-name">SkoolCal Sync</span>
      </div>
      <div class="topbar-actions">
        <button id="refresh" class="icon-btn" title="Re-scan this page" aria-label="Re-scan this page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4L5.3 5.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <section class="community-bar">
      <label class="sr-only" for="community">Community</label>
      <select id="community" class="community-select"></select>
      <span id="count" class="count"></span>
    </section>

    <section id="status" class="status" hidden>
      <div class="status-row">
        <span id="status-spinner" class="spinner"></span>
        <span id="status-text" class="status-text"></span>
      </div>
      <div id="progress" class="progress" hidden><div id="progress-bar" class="progress-bar"></div></div>
    </section>

    <section id="filters" class="filters">
      <input id="search" class="input" type="search" placeholder="Search events…" autocomplete="off">
      <div id="presets" class="presets" role="group" aria-label="Date range"></div>
      <p id="page-hint" class="page-hint" hidden></p>
    </section>

    <section class="toolbar">
      <button id="select-all" class="link-btn">Select all</button>
      <button id="select-none" class="link-btn">Deselect all</button>
      <label class="switch"><input id="only-upcoming" type="checkbox"> Upcoming</label>
    </section>

    <main id="list" class="list" aria-live="polite"></main>

    <section id="warnings" class="warnings" hidden></section>

    <footer class="actions">
      <div class="selected-count"><strong id="selected-count">0</strong> selected</div>
      <div class="action-grid">
        <button id="export-merged" class="btn btn-primary">
          <span>Export as one .ics</span>
        </button>
        <button id="export-individual" class="btn">Individual .ics files</button>
        <button id="sync-google" class="btn btn-google">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="gicon"><path fill="#4285F4" d="M21.6 12.2c0-.7-.06-1.4-.18-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 4.9-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z"/></svg>
          Sync to Google Calendar
        </button>
        <button id="copy-links" class="btn btn-ghost">Copy Google Calendar links</button>
      </div>
      <p class="privacy">Everything runs locally in your browser. Data leaves your device only when you choose “Sync to Google Calendar”.</p>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="../lib/browser.js"></script>
  <script src="../lib/constants.js"></script>
  <script src="../lib/datetime.js"></script>
  <script src="../lib/daterange.js"></script>
  <script src="../lib/ics.js"></script>
  <script src="../lib/events.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/messaging.js"></script>
  <script src="popup.js"></script>
</body>
</html>
